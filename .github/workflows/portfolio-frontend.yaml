name: Build Portfolio Frontend

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/portfolio-frontend.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/portfolio-frontend

jobs:
  build:
    name: Build & Push Portfolio Frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Environment
        id: environment
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "image_tag=dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://dev.developerchoudhary.com" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "prod" ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "image_tag=prod-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://developerchoudhary.com" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        working-directory: apps/frontend
        env:
          IMAGE_TAG: ${{ steps.environment.outputs.image_tag }}
          SITE_URL: ${{ steps.environment.outputs.site_url }}
        run: |
          IMAGE="$IMAGE_NAME:$IMAGE_TAG"

          echo "Building image: $IMAGE"

          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL="$SITE_URL" \
            -t "$IMAGE" \
            .

      - name: Push Docker Image
        env:
          IMAGE_TAG: ${{ steps.environment.outputs.image_tag }}
        run: |
          IMAGE="$IMAGE_NAME:$IMAGE_TAG"

          echo "Pushing image: $IMAGE"

          docker push "$IMAGE"

      - name: Clean up Docker
        if: always()
        run: |
          docker system prune -af --volumes || true
