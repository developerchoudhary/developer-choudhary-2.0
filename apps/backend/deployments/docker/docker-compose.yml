services:
  postgres:
    image: postgres:17
    container_name: portfolio-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: portfolio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - portfolio_minio_data:/data

  gotenberg:
    image: gotenberg/gotenberg:8.34.0-chromium
    container_name: portfolio-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=30s
      - --chromium-max-concurrency=1
    ports:
      - "3001:3000"

volumes:
  portfolio_postgres_data:
    name: portfolio_postgres_data
  portfolio_minio_data:
    name: portfolio_minio_data
