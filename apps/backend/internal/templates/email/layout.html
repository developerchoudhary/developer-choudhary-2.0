{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>{{.SiteName}}</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;padding:32px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
<tr><td style="height:4px;line-height:4px;font-size:0;background:{{$.BrandTo}};background-image:linear-gradient(90deg,{{$.BrandFrom}},{{$.BrandTo}});">&nbsp;</td></tr>
<tr><td style="padding:28px 32px 8px;">
<a href="{{.SiteURL}}" style="text-decoration:none;color:#0f172a;font-weight:700;font-size:15px;letter-spacing:-0.01em;">{{.SiteName}}</a>
</td></tr>
<tr><td style="padding:8px 32px 32px;font-size:15px;line-height:1.6;">{{end}}

{{define "foot"}}</td></tr>
<tr><td style="padding:20px 32px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:12px;color:#64748b;">
© {{.Year}} {{.SiteName}} · <a href="{{.SiteURL}}" style="color:{{$.Accent}};">{{.SiteURL}}</a>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>{{end}}

{{define "row"}}<tr><td style="padding:6px 0;color:#64748b;font-size:13px;width:140px;vertical-align:top;">{{.K}}</td><td style="padding:6px 0;font-size:14px;">{{.V}}</td></tr>{{end}}
