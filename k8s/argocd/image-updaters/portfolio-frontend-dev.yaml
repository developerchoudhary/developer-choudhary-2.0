apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: portfolio-frontend-image-updater-dev
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: portfolio-frontend-dev
      images:
        - alias: portfolio-frontend
          imageName: ghcr.io/developerchoudhary/portfolio-frontend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^dev-[a-f0-9]+$"
            pullSecret: pullsecret:argocd/ghcr-secret
          manifestTargets:
            kustomize:
              name: ghcr.io/developerchoudhary/portfolio-frontend
  writeBackConfig:
    method: git
    gitConfig:
      branch: dev
      writeBackTarget: kustomization
