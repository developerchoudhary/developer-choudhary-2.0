apiVersion: apps/v1
kind: Deployment

metadata:
  name: portfolio-backend
  labels:
    app: portfolio-backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-backend
  template:
    metadata:
      labels:
        app: portfolio-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      terminationGracePeriodSeconds: 30

      initContainers:
        - name: migrate
          image: ghcr.io/developerchoudhary/portfolio-backend
          imagePullPolicy: Always
          args: ["migrate-up"]
          envFrom:
            - configMapRef:
                name: portfolio-backend-config
            - secretRef:
                name: portfolio-backend-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

        - name: seed
          image: ghcr.io/developerchoudhary/portfolio-backend
          imagePullPolicy: Always
          args: ["seed"]
          envFrom:
            - configMapRef:
                name: portfolio-backend-config
            - secretRef:
                name: portfolio-backend-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

      containers:
        - name: portfolio-backend
          image: ghcr.io/developerchoudhary/portfolio-backend
          imagePullPolicy: Always
          args: ["api"]
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: portfolio-backend-config
            - secretRef:
                name: portfolio-backend-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          terminationMessagePolicy: File
