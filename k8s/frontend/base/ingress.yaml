apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: portfolio-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - CHANGE_ME
      secretName: portfolio-tls

  rules:
    - host: CHANGE_ME
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: portfolio-backend
                port:
                  number: 80

          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: portfolio-backend
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-frontend
                port:
                  number: 3000
