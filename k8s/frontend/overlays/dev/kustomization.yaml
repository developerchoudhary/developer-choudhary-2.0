apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: portfolio-ingress
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.developerchoudhary.com
      - op: replace
        path: /spec/rules/0/host
        value: dev.developerchoudhary.com

images:
  - name: ghcr.io/developerchoudhary/portfolio-frontend
    newName: ghcr.io/developerchoudhary/portfolio-frontend
    newTag: dev-latest
