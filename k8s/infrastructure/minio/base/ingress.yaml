apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: minio-console
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - CHANGE_ME
      secretName: minio-console-tls

  rules:
    - host: CHANGE_ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-console
                port:
                  number: 9001
