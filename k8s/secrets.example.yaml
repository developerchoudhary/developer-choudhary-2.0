# Secrets are never committed. Create them once per namespace with kubectl (or SealedSecrets / SOPS).
# Replace every value. The same JWT/REVALIDATE values must be shared where noted.
---
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-backend-secret
  namespace: portfolio
type: Opaque
stringData:
  DATABASE_URL: "postgres://portfolio:CHANGE_ME@postgres-0.postgres.infrastructure.svc.cluster.local:5432/portfolio?sslmode=disable"
  JWT_SECRET: "CHANGE_ME_64_random_chars"
  MINIO_ACCESS_KEY: "CHANGE_ME"            # same as minio-secret MINIO_ROOT_USER (or a dedicated MinIO user)
  MINIO_SECRET_KEY: "CHANGE_ME"
  SMTP_USERNAME: "contact@developerchoudhary.com"
  SMTP_PASSWORD: "CHANGE_ME_app_password"
  SMTP_FROM: "Developer Choudhary <contact@developerchoudhary.com>"
  NOTIFY_EMAIL: "contact@developerchoudhary.com"
  REVALIDATE_SECRET: "CHANGE_ME_shared_with_frontend"
  ADMIN_EMAIL: "admin@developerchoudhary.com"
  ADMIN_PASSWORD: "CHANGE_ME_10plus_chars_with_numbers"
  ADMIN_NAME: "Aman Choudhary"
---
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-frontend-secret
  namespace: portfolio
type: Opaque
stringData:
  REVALIDATE_SECRET: "CHANGE_ME_shared_with_backend"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: infrastructure
type: Opaque
stringData:
  POSTGRES_USER: "portfolio"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "portfolio"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: infrastructure
type: Opaque
stringData:
  MINIO_ROOT_USER: "CHANGE_ME"
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
